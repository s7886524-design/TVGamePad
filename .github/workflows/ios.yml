name: iOS Build

on:
  push:
    branches:
      - main
    paths:
      - "iOS/TVGamePad/**"
      - "project.yml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: xcodebuild -project TVGamePad.xcodeproj -scheme TVGamePad -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: TVGamePad-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/TVGamePad.app
          retention-days: 14
